name: Wydanie systemu

# Nowe wydanie powstaje samo, gdy na main zmieni się "version" w system.json
# (albo ręcznie: Actions → Wydanie systemu → Run workflow).
on:
  push:
    branches: [main]
    paths: ["system.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wersja z system.json
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p 'require("./system.json").version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Ustaw wersję, manifest i download w system.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("system.json", "utf8"));
            s.version = process.env.VERSION;
            s.url = `https://github.com/${process.env.REPO}`;
            s.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/system.json`;
            s.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/degenesis2.zip`;
            fs.writeFileSync("system.json", JSON.stringify(s, null, 2));
          '

      - name: Kompilacja kompendiów i testy
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Paczka ZIP (folder degenesis2/)
        run: |
          mkdir -p dist/degenesis2
          cp -r assets degenesis2.mjs lang module packs styles templates system.json README.md dist/degenesis2/
          cd dist && zip -rq degenesis2.zip degenesis2

      - name: Załącz pliki do Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ "${{ steps.ver.outputs.exists }}" != "true" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Degenesis 2.0 — $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/degenesis2.zip system.json --clobber
